<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image to PDF</title><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script></head>
<body><header class="site-header"><a class="brand" href="index.html">Image<span>&</span>PDF Toolkit</a></header>
<main class="container tool-page"><a class="back" href="index.html">← All tools</a>
<section class="panel"><h1>Image to PDF</h1><label class="dropzone" id="drop"><input id="file" type="file" accept="image/*" multiple><strong>Choose or drop one or more images</strong><span class="muted">Images are combined in selection order.</span></label>
<div class="controls"><div class="field"><label>Page size</label><select id="page"><option value="a4">A4</option><option value="letter">Letter</option><option value="image">Match image size</option></select></div><div class="field"><label>JPEG quality</label><input id="quality" type="number" min=".4" max="1" step=".05" value=".9"></div><div class="field"><label>Margin (pt)</label><input id="margin" type="number" min="0" value="18"></div></div>
<button class="btn" id="go" disabled>Create PDF</button><div id="status"></div><div id="results" class="result-grid"></div></section>
</main>
<footer>Image & PDF Toolkit</footer><script type="module" src="js/features/image-to-pdf.js"></script></body></html>
