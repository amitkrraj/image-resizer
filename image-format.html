<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Format</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">Image<span>&</span>PDF Toolkit</a></header>
<main class="container tool-page"><a class="back" href="index.html">← All tools</a>
<section class="panel"><h1>Change Image Format</h1><label class="dropzone" id="drop"><input id="file" type="file" accept="image/*"><strong>Choose or drop an image</strong></label>
<div id="controls" class="hidden"><div class="controls"><div class="field"><label>Output</label><select id="format"><option value="image/jpeg">JPG</option><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option></select></div><div class="field" id="qualityBox"><label>JPEG quality</label><input id="quality" type="range" min=".1" max="1" step=".05" value=".92"><span id="qv">92%</span></div></div><button class="btn" id="go">Convert & Download</button></div><img id="preview" class="preview hidden"><div id="status"></div></section>
</main>
<footer>Image & PDF Toolkit</footer><script type="module" src="js/features/image-format.js"></script></body></html>
