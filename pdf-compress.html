<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Compress PDF</title><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs" type="module"></script></head>
<body><header class="site-header"><a class="brand" href="index.html">Image<span>&</span>PDF Toolkit</a></header>
<main class="container tool-page"><a class="back" href="index.html">← All tools</a>
<section class="panel"><h1>Reduce PDF Size</h1><p class="muted">This performs safe structural optimization with pdf-lib. For PDFs dominated by large embedded photos, use the image-to-PDF workflow to rebuild them with controllable JPEG quality.</p>
<label class="dropzone" id="drop"><input id="file" type="file" accept="application/pdf"><strong>Choose or drop a PDF</strong></label>
<div class="controls"><div class="field"><label>Compression mode</label><select id="mode"><option value="normal">Optimize structure</option><option value="images">Rebuild pages as JPEG images (smaller, but rasterizes text)</option></select></div><div class="field"><label>JPEG quality for raster mode</label><input id="quality" type="number" min="0.2" max="1" step="0.05" value="0.65"></div></div>
<button class="btn" id="go" disabled>Compress PDF</button><div id="status"></div></section>
</main>
<footer>Image & PDF Toolkit</footer><script type="module" src="js/features/pdf-compress.js"></script></body></html>
